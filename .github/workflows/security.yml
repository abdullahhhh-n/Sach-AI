name: Security audit
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Audit npm lockfiles
        run: |
          npm audit --json > /tmp/frontend-audit.json || true
          npm --prefix server audit --json > /tmp/backend-audit.json || true
          node -e "for (const p of ['/tmp/frontend-audit.json','/tmp/backend-audit.json']) { const r=require(p); console.log(p,JSON.stringify(r)); }"
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version: '3.11'
      - name: Audit Python dependency resolution
        run: |
          python -m pip install pip-audit
          pip-audit -r ml-service/requirements.txt --format=json --output=/tmp/python-audit.json || true
          cat /tmp/python-audit.json
      - name: Check complete history for credentials
        run: |
          git log --all --format='%H' | while read rev; do
            git grep -IlE '(gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|AKIA[0-9A-Z]{16}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' "$rev" -- . ':!*.ipynb' || true
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dependency-audit
          path: /tmp/*-audit.json
          retention-days: 7
